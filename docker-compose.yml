services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dp_work
      POSTGRES_USER: chenjiang
      POSTGRES_PASSWORD: chenjiang
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chenjiang -d dp_work"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
