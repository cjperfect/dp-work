[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-work-sidecar"
version = "0.1.0"
description = "豆包流式 ASR 与转写事件推送（Sidecar）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "websockets>=15,<18",
    "langchain-community>=0.4,<0.5",
    "langchain>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "pymupdf>=1.26,<2",
    "pymupdf4llm>=0.0.17,<1",
    "python-docx>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.meetings" = ["prompts/*.md"]

[project.optional-dependencies]
test = ["pytest>=8"]
packaging = ["pyinstaller>=6.20,<7"]
