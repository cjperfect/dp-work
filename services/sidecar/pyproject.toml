[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-work-sidecar"
version = "0.1.0"
description = "豆包流式 ASR + 本地 SQLite 实时转写保存 + 待同步队列（Sidecar）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
asr = [
    # 豆包流式 ASR 官方 SDK（definite 分句来自 show_utterances）
    "volcengine-python-sdk[streaming]>=1.0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]
