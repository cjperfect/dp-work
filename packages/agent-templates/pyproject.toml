[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-work-agent-templates"
version = "0.1.0"
description = "Shared default Agent prompt templates for DP Work"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["templates"]

[tool.setuptools.package-data]
templates = ["*/AGENT.md"]
